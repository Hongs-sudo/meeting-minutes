<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수학도서관 중등부 주간회의록</title>
<meta name="theme-color" content="#1f4e4d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="중등부 회의록">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --ink:#14302e; --ink2:#4d6664; --faint:#8ba09e;
  --paper:#fff; --desk:#d7dedc; --rail:#123230; --rail2:#1d4644; --rail3:#2c5a57;
  --line:#c9d5d3; --line2:#e3eae9; --brand:#1f4e4d; --brand-soft:#dfeae9;
  --alert:#a33a2b; --alert-soft:#fbe6e2; --ok:#2f6b46; --ok-soft:#e2f0e6;
  --edit:#fffbe9; --ghost:#b9b7a4;
  --pagew:210mm; --pageh:296.6mm; --padv:11mm; --padh:10mm;
  --kr:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--kr);color:var(--ink);background:var(--desk);
  -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
button,select,input{font-family:inherit}
button{font-size:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid #4f8f8b;outline-offset:2px}

.app{display:grid;grid-template-columns:266px 1fr;height:100%}

/* ───────── rail ───────── */
.rail{background:var(--rail);color:#dbe8e6;display:flex;flex-direction:column;min-height:0}
.rail-head{padding:18px 18px 12px}
.rail-head h1{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em;color:#fff}
.rail-head p{margin:3px 0 0;font-size:11.5px;color:#84a6a3}
.rail-tabs{display:flex;gap:2px;padding:0 12px 10px}
.rail-tabs button{flex:1;background:none;border:0;padding:7px 0;border-radius:6px;
  font-size:12.5px;color:#8fb0ad;font-weight:600}
.rail-tabs button[aria-selected=true]{background:var(--rail3);color:#fff}
.search{margin:0 12px 10px;display:flex;gap:5px}
.search input{width:100%;background:var(--rail2);border:1px solid #2f5f5c;border-radius:6px;
  padding:7px 10px;color:#eaf2f1;font-size:12.5px}
.search input{flex:1;min-width:0}
.search button{flex:none;background:var(--rail2);border:1px solid #2f5f5c;border-radius:6px;
  padding:0 9px;color:#9fc0bd;font-size:11.5px;font-weight:600;white-space:nowrap}
.search button:hover{background:var(--rail3);color:#fff}
.search input::placeholder{color:#7a9c99}
.rail-list{flex:1 1 auto;min-height:46%;overflow-y:auto;padding:0 8px 8px}
.mgroup{margin:10px 4px 4px;font-size:11px;font-weight:700;color:#7fa29f}
.witem{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;cursor:pointer}
.witem:hover{background:var(--rail2)}
.witem[aria-current=true]{background:#eef4f3;color:var(--rail)}
.witem[aria-current=true] .wsub{color:#5c7b78}
.witem input{accent-color:#6fb3ae;margin:0;flex:none}
.wmain{flex:1;min-width:0}
.wtitle{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wsub{font-size:11px;color:#87a8a5;margin-top:1px}
.rail-foot{padding:10px 12px 14px;border-top:1px solid #234f4d;display:grid;gap:7px;
  flex:0 0 auto;max-height:54%;overflow-y:auto}
.footbar{display:flex;align-items:center;gap:8px}
.fstat{flex:1;min-width:0;font-size:11.5px;color:#9fc0bd;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.fstat i{width:7px;height:7px;border-radius:50%;background:#6fb3ae;flex:none}
.fstat.off i{background:#8a7d5a}
.gear{flex:none;background:var(--rail2);border:1px solid #2f5f5c;border-radius:6px;
  padding:5px 10px;color:#cfe2e0;font-size:11.5px;font-weight:600}
.gear:hover{background:var(--rail3);color:#fff}
.more{display:grid;gap:6px;padding-top:2px;border-top:1px solid #234f4d;margin-top:2px}
.more[hidden]{display:none}
.rail-foot button{background:var(--rail2);border:1px solid #2f5f5c;border-radius:7px;
  padding:8px 10px;font-size:12.5px;color:#dbe8e6;text-align:left}
.rail-foot button:hover{background:var(--rail3)}
.rail-foot .primary{background:#e9f1f0;color:var(--rail);border-color:#e9f1f0;font-weight:700;text-align:center}
.rail-foot .two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rail-foot .two button{text-align:center;padding:8px 4px;font-size:11.5px}
.fileinfo{font-size:11.5px;line-height:1.45;padding:8px 10px;border-radius:7px;
  background:#17403e;border:1px solid #2b5b58;color:#a9c6c3}
.fileinfo b{display:block;color:#eaf4f3;font-size:12px;word-break:break-all}
.fileinfo.linked{background:#1c4d3a;border-color:#2f7052;color:#b6dcc5}
.fileinfo.warn{background:#4a2f21;border-color:#7a5030;color:#f0cba6}
.fileinfo button{margin-top:6px;width:100%;background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:5px;color:#fff;font-size:11.5px;font-weight:600}
.fileinfo button:hover{background:rgba(255,255,255,.26)}
.fileinfo .bk{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:11.5px;cursor:pointer}
.fileinfo .bk input{accent-color:#6fb3ae;margin:0}
.fileinfo .bkinfo{display:block;margin-top:3px;font-size:10.5px;opacity:.85}

/* ───────── main ───────── */
.main{min-width:0;display:flex;flex-direction:column;min-height:0}
.bar{display:flex;align-items:center;gap:8px;padding:10px 18px;background:#eef2f1;
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar .grow{flex:1}
.btn{background:#fff;border:1px solid var(--line);border-radius:7px;padding:6px 12px;font-size:12.5px;font-weight:600}
.btn:hover{border-color:#9db6b3}
.btn.solid{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.solid:hover{background:#17403f}
.btn.ghostbtn{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.danger:hover{color:var(--alert);border-color:var(--alert)}
.btn[disabled]{opacity:.4;cursor:default}
.mode{font-size:12px;color:var(--ink2)}
.sv{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink2)}
.sv i{width:7px;height:7px;border-radius:50%;background:#9db6b3;flex:none}
.sv.typing{border-color:#dcc98a;background:#fffbe9;color:#8a6a1f}
.sv.typing i{background:#c9a53c;animation:pulse 1s infinite}
.sv.saving{border-color:#bcd7ea;background:#eef5fb;color:#1e5c88}
.sv.saving i{background:#3b83c0;animation:pulse .8s infinite}
.sv.local{border-color:#cfe0de;background:#f1f7f6;color:var(--brand)}
.sv.local i{background:#4f8f8b}
.sv.synced{border-color:#bcdcc7;background:var(--ok-soft);color:var(--ok)}
.sv.synced i{background:#3d8a5c}
.sv.warn{border-color:#e8b9b0;background:var(--alert-soft);color:var(--alert)}
.sv.warn i{background:var(--alert)}
@keyframes pulse{50%{opacity:.25}}
.btn .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#ffd36b;margin-left:5px;vertical-align:1px}
.scroll{flex:1;overflow:auto;padding:22px 20px 60px;display:flex;flex-direction:column;align-items:center}
.tip{width:100%;max-width:820px;margin:0 0 12px;padding:9px 13px;background:#fff8e1;
  border-left:3px solid #cfa63c;border-radius:0 5px 5px 0;font-size:12.5px;color:#6b5518;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tip .adopts{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto}
.tip .ad{border:1px solid #ddc98a;background:#fffdf5;color:#6b5518;border-radius:999px;
  padding:3px 11px;font-size:12px;font-weight:600;white-space:nowrap}
.tip .ad:hover{border-color:#c9a53c}
.tip .ad[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.tip .ad.all{background:#f3e7c0;border-color:#d9c188}
.tip .x{margin-left:auto;border:0;background:none;color:#a08a4a;font-size:15px;line-height:1;padding:0 3px}

/* ───────── A4 stage ───────── */
.stage{position:relative;flex:none}
.sheet{position:absolute;top:0;left:0;transform-origin:top left;
  width:var(--pagew);height:var(--pageh);padding:var(--padv) var(--padh);
  background:var(--paper);overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.13),0 14px 36px rgba(20,48,46,.16)}
.page{transform-origin:top left;font-size:10pt;line-height:1.36;color:#1A1A1A}
.editing .sheet{box-shadow:0 1px 2px rgba(0,0,0,.13),0 14px 36px rgba(20,48,46,.16),0 0 0 3px #cbe0de}

.page h2{margin:0;background:var(--brand);color:#fff;text-align:center;font-size:1.65em;
  font-weight:700;padding:7px 6px;letter-spacing:-.01em}
.grid{display:grid;border:1px solid var(--line);border-top:0}
.row{display:grid;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.r3{grid-template-columns:60px 1fr 46px 132px 52px 96px}
.r2{grid-template-columns:60px 1fr 46px 118px}
.rn{grid-template-columns:60px 1fr 46px 1fr}
.r1{grid-template-columns:60px 1fr}
.lab{background:#f1f6f5;font-weight:700;font-size:.92em;color:var(--brand);
  display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line);
  padding:4px 2px;text-align:center;line-height:1.2}
.val{padding:3px 7px;border-right:1px solid var(--line);min-height:23px;display:flex;
  align-items:center;gap:4px;flex-wrap:wrap}
.val:last-child{border-right:0}
.val .dim{color:#6d7d7c;font-size:.9em}
.fi{font:inherit;font-size:.92em;border:1px solid var(--line);border-radius:4px;
  background:#fff;color:inherit;padding:1px 4px;height:1.85em;line-height:1.6;max-width:100%}
.fi:focus{outline:2px solid #7fb5b1;outline-offset:-1px}
.fi.d{padding:1px 3px}
.fi.n{padding:1px 2px}
.fi.w{min-width:6em}
.editing .fi{background:var(--edit)}
.editing .row.r3{grid-template-columns:58px 1.7fr 44px 1fr 52px 1fr}
.val .cl{margin:0 -2px;font-weight:700}
.sec{background:#2e6e6c;color:#fff;font-weight:700;font-size:.96em;padding:3px 10px;
  display:flex;align-items:center;gap:9px;margin-top:5px}
.sec .hint{font-weight:400;font-size:.84em;color:#bcd8d6}
.sec .tools{margin-left:auto;display:flex;gap:5px}
.box{border:1px solid var(--line);border-top:0}
.line{padding:3px 10px;border-bottom:1px solid var(--line2);min-height:21px}
.pline{display:grid;grid-template-columns:26px 1fr 88px auto;border-bottom:1px solid var(--line2);min-height:21px}
.pline:last-child{border-bottom:0}
.pno{background:#f5f9f8;color:var(--faint);font-size:.86em;display:flex;align-items:center;
  justify-content:center;border-right:1px solid var(--line2)}
.pval{padding:3px 9px;min-width:0;word-break:break-word}
.line:last-child{border-bottom:0}

table.act{width:100%;border-collapse:collapse;table-layout:fixed}
table.act th{background:#2e6e6c;color:#fff;font-size:.88em;font-weight:700;padding:3px 2px;border:1px solid #2e6e6c}
table.act td{border:1px solid var(--line);padding:3px 6px;font-size:.94em;vertical-align:middle;height:21px}
table.act td.c{text-align:center;padding:3px 2px}
table.act tr.done td{background:var(--ok-soft)}
table.act tr.late td{background:var(--alert-soft);color:var(--alert);font-weight:600}
.rowdel{border:0;background:none;color:var(--faint);font-size:12px;line-height:1;padding:0 2px}
.rowdel:hover{color:var(--alert)}

.ag{border:1px solid var(--line);border-top:0}
.ag-head{display:grid;grid-template-columns:52px 1fr;border-bottom:1px solid var(--line)}
.ag-no{background:#2e6e6c;color:#fff;font-weight:700;font-size:.92em;display:flex;
  align-items:center;justify-content:center;padding:3px}
.ag-title{background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:.98em;
  padding:4px 8px;display:flex;align-items:center;gap:8px}
.ag-body>*:last-child{border-bottom:0}
.txt{display:grid;grid-template-columns:32px 1fr auto;gap:0;
  border-bottom:1px solid var(--line2);min-height:19px}
.tno{padding:2px 2px 2px 8px;font-size:.95em;white-space:nowrap}
.tbody{padding:2px 10px 2px 2px;white-space:pre-wrap;word-break:break-word;min-width:0}
.blk{border-bottom:1px solid var(--line2);padding:4px 8px}
.tbtools{display:flex;gap:4px;margin-bottom:4px;flex-wrap:wrap}
.tbtools .mini{border-color:#a8c8c6;background:#fff;color:var(--brand)}
.imgblk{text-align:center}
.imgblk img{display:inline-block;max-width:100%;border:1px solid var(--line);border-radius:3px}
.imgblk .cap{font-size:.86em;color:#6d7d7c;margin-top:2px}
table.sub{width:100%;border-collapse:collapse;table-layout:fixed;border-bottom:1px solid var(--line2)}
table.sub td{border:1px solid var(--line);padding:2px 5px;font-size:.88em;text-align:center;
  background:#f8fbfa;height:calc(1.36em + 6px);vertical-align:middle}
table.sub.al-left td{text-align:left}
table.sub.al-right td{text-align:right}
.tbtools .sep{width:1px;background:#c9d5d3;margin:0 3px}
.tbtools .mini.on{background:var(--brand);color:#fff;border-color:var(--brand)}

.editing [data-edit]{background:var(--edit);border-radius:2px}
.editing td [data-edit],.editing .pval [data-edit],.editing .tno [data-edit],.editing .tbody [data-edit],
.editing .val [data-edit],.editing .ag-title [data-edit]{display:block;width:100%;min-height:1.25em}
.editing [data-edit]:empty{outline:1px dashed #cdb96f;outline-offset:1px}
.editing [data-edit]:empty:before{content:attr(data-lb);color:#bdb391;font-size:.9em}
.editing [data-lb=""]:empty:before{content:""}
/* 진한 바탕(제목·안건번호) 위에서는 편집 중 글씨를 어둡게 뒤집는다 */
/* 진한 바탕(제목·안건번호)은 편집 중에도 인쇄와 똑같이 보여준다 */
.editing .page h2 [data-edit],.editing .ag-no [data-edit]{
  background:transparent;color:#fff;padding:0 6px;border-radius:3px;
  outline:1px dashed rgba(255,255,255,.65);outline-offset:1px}
.editing .page h2 [data-edit]:empty:before,.editing .ag-no [data-edit]:empty:before{color:rgba(255,255,255,.55)}
.editing .page h2 [data-edit]:empty,.editing .ag-no [data-edit]:empty{outline-color:rgba(255,255,255,.65)}
.editing .page h2 [data-edit].sel,.editing .ag-no [data-edit].sel{box-shadow:0 0 0 2px #fff;outline:none}
[contenteditable]{outline:none}
[contenteditable]:focus{box-shadow:inset 0 0 0 2px #7fb5b1}
body:not(.editing) .edit-only{display:none!important}
.mini{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.16);color:inherit;
  border-radius:5px;font-size:.84em;padding:1px 7px;font-weight:600}
.mini:hover{background:rgba(255,255,255,.32)}
.ag-title .mini{border-color:#a8c8c6;background:#fff;color:var(--brand)}

/* ───────── tracker ───────── */
.panel{width:min(1080px,100%);background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.panel-head{padding:16px 20px;border-bottom:1px solid var(--line2)}
.panel-head h3{margin:0 0 3px;font-size:16px}
.panel-head p{margin:0;font-size:12.5px;color:var(--ink2)}
.stats{display:flex;border-bottom:1px solid var(--line2)}
.stat{flex:1;padding:12px 16px;border-right:1px solid var(--line2)}
.stat:last-child{border-right:0}
.stat b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em}
.stat span{font-size:11.5px;color:var(--ink2)}
.stat.bad b{color:var(--alert)}
.filters{display:flex;gap:6px;padding:12px 20px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 13px;font-size:12px;font-weight:600}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
table.trk{width:100%;border-collapse:collapse}
table.trk th{text-align:left;font-size:11.5px;color:var(--ink2);font-weight:600;
  padding:9px 14px;border-bottom:1px solid var(--line)}
table.trk td{padding:9px 14px;border-bottom:1px solid var(--line2);font-size:13px;vertical-align:top}
table.trk tr.late td{background:var(--alert-soft)}
table.trk tr.done td{color:var(--faint)}
table.trk .wk{color:var(--brand);font-weight:600;font-size:12px;background:none;border:0;padding:0;text-decoration:underline}
.empty{padding:44px 20px;text-align:center;color:var(--faint);font-size:13.5px}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);
  background:var(--rail);color:#fff;padding:9px 18px;border-radius:8px;font-size:13px;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%)}

.fmtbar{display:none;background:#f6f9f8;border-bottom:1px solid var(--line);padding:8px 18px;gap:6px}
body.editing .fmtbar{display:flex;align-items:center;flex-wrap:wrap}
.fmtbar .fl{font-size:11.5px;color:var(--ink2);font-weight:700}
.fmtbar .grow{flex:1}
.fmtbar .selname{font-size:11.5px;color:var(--brand);font-weight:700;
  max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sq{width:25px;height:25px;border:1px solid var(--line);background:#fff;border-radius:6px;
  font-size:14px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center}
.sq:hover{border-color:#9db6b3}
.num{width:48px;height:25px;border:1px solid var(--line);border-radius:6px;text-align:center;
  font-size:12.5px;padding:0 2px;background:#fff;color:var(--ink)}
.unit{font-size:11px;color:var(--faint);margin-left:-2px}
.sep{width:1px;height:18px;background:var(--line);margin:0 6px}
.sw{width:19px;height:19px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0}
.sw[aria-pressed=true]{box-shadow:0 0 0 2px var(--brand)}
.fmtbar [disabled]{opacity:.4;cursor:default}
.editing [data-edit].sel{box-shadow:inset 0 0 0 2px #4f8f8b}
.modal{position:fixed;inset:0;background:rgba(16,38,37,.55);display:flex;align-items:center;
  justify-content:center;z-index:60;padding:20px}
.modal[hidden]{display:none}
.modal .card{background:#fff;border-radius:12px;padding:22px;width:min(460px,100%);
  box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{margin:0 0 8px;font-size:17px}
.modal p{margin:0 0 16px;font-size:12.5px;color:var(--ink2);line-height:1.6}
.modal label{display:block;font-size:12px;font-weight:700;margin:10px 0 4px}
.modal input,.modal textarea{width:100%;border:1px solid var(--line);border-radius:7px;
  padding:8px 10px;font-size:13px;font-family:inherit;resize:vertical}
.modal textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.5}
.modal .acts{display:flex;gap:8px;margin-top:18px;align-items:center}
.modal.login{background:linear-gradient(160deg,#1b4644,#0e2a29)}
.modal.login .card{width:min(380px,100%)}
.modal .lg{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.modal .lg img{border-radius:10px}
.modal .err{margin:0 0 12px;font-size:12.5px;color:var(--alert);background:var(--alert-soft);
  padding:8px 10px;border-radius:7px;line-height:1.5}
.gbtn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px;
  font-size:13.5px;font-weight:600}
.gbtn:hover{background:#f6f9f8;border-color:#9db6b3}
.or{display:flex;align-items:center;gap:10px;margin:16px 0 2px;color:var(--faint);font-size:11.5px}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line2)}
.pill{display:inline-block;padding:0 6px;border-radius:9px;font-size:.86em;font-weight:700;

/* ══════════════ 저장 ══════════════
   3중으로 남깁니다.
   ① 실제 파일(File System Access) — 캐시를 지워도 남는 진짜 원본
   ② IndexedDB — 브라우저 안의 작업본
   ③ localStorage — 예비본
   ─────────────────────────────── */
const DBN="mathlib-db", STN="kv";
function idbOpen(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open(DBN,1);
    r.onupgradeneeded = ()=>{ if(!r.result.objectStoreNames.contains(STN)) r.result.createObjectStore(STN); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
async function idbGet(k){
  try{ const db=await idbOpen();
    return await new Promise((res,rej)=>{ const q=db.transaction(STN,"readonly").objectStore(STN).get(k);
      q.onsuccess=()=>res(q.result??null); q.onerror=()=>rej(q.error); });
  }catch(e){ return null; }
}
async function idbSet(k,v){
  try{ const db=await idbOpen();
    await new Promise((res,rej)=>{ const q=db.transaction(STN,"readwrite").objectStore(STN).put(v,k);
      q.onsuccess=res; q.onerror=()=>rej(q.error); });
    return true;
  }catch(e){ return false; }
}
const mem = {};
const store = {
  async get(k){
    const a = await idbGet(k); if(a!=null) return a;
    if(window.storage){ try{ const r=await window.storage.get(k); if(r) return r.value; }catch(e){} }
    try{ const v=localStorage.getItem(k); if(v!==null) return v; }catch(e){}
    return mem[k] ?? null;
  },
  async set(k,v){
    mem[k]=v;
    await idbSet(k,v);
    if(window.storage){ try{ await window.storage.set(k,v); }catch(e){} }
    try{ localStorage.setItem(k,v); }catch(e){}
  }
};

/* 칸 안에 부분 서식(색·크기)을 담기 위해 제한된 HTML만 허용 */
const OKTAG = {SPAN:1,B:1,I:1,U:1,STRONG:1,EM:1,BR:1};
function sanitize(html){
  if(html==null) return "";
  const t = String(html);
  if(!/[<&]/.test(t)) return t;
  const box = document.createElement("div");
  box.innerHTML = t;
  const walk = n=>{
    [...n.childNodes].forEach(c=>{
      if(c.nodeType===3) return;
      if(c.nodeType!==1){ c.remove(); return; }
      if(!OKTAG[c.tagName]){
        const f=document.createDocumentFragment();
        while(c.firstChild) f.appendChild(c.firstChild);
        c.replaceWith(f); return;
      }
      const st={color:c.style.color, backgroundColor:c.style.backgroundColor,
                fontSize:c.style.fontSize, fontWeight:c.style.fontWeight};
      [...c.attributes].forEach(a=>c.removeAttribute(a.name));
      Object.entries(st).forEach(([k,v])=>{ if(v) c.style[k]=v; });
      walk(c);
    });
  };
  walk(box); walk(box);
  return box.innerHTML;
}
function stripHtml(h){
  if(h==null) return "";
  const t=String(h);
  if(!/[<&]/.test(t)) return t;
  const d=document.createElement("div"); d.innerHTML=t; return d.textContent||"";
}

function listen(){
  if(fbUnsub) fbUnsub();
  const {collection, onSnapshot} = fbM;
  fbUnsub = onSnapshot(collection(db, COL), snap=>{
    let changed = 0;
    snap.docChanges().forEach(ch=>{
      const id = ch.doc.id;
      const i = state.weeks.findIndex(w=>w.id===id);
      if(ch.type === "removed"){
        if(i>=0 && !state.weeks[i]._dirty){ state.weeks.splice(i,1); changed++; }
        return;
      }
      const r = fromFs(ch.doc.data());
      if(!r || !r.agendas) return;
      if(i>=0){
        if(wsig(state.weeks[i]) === wsig(r)){ conflicts.delete(id); return; }
        if(state.weeks[i]._dirty){                        /* 내 미저장 수정이 있는 주차 */
          if(r._by && r._by !== who()) conflicts.set(id, r);
          changed++; return;
        }
        if(state.weeks[i]._u && r._u && r._u <= state.weeks[i]._u) return;
        state.weeks[i] = r; conflicts.delete(id); changed++;
      }else{ state.weeks.push(r); changed++; }
    });
    if(!changed) return;
    normalize();
    if(!state.weeks.some(w=>w.id===state.cur)) state.cur = state.weeks[state.weeks.length-1]?.id ?? null;
    fbStamp = new Date().toISOString();
    renderList(); renderMain(); renderSyncInfo();
    store.set(KEY, JSON.stringify(payload()));
    if(!document.hasFocus()) return;
    toast("다른 기기·다른 사람이 수정한 내용을 불러왔습니다.");
  }, err=>{ fbOn=false; renderSyncInfo();
    toast("연동이 끊겼습니다 : "+(err.code||err.message)); });
}
function toFs(w){
  const c = JSON.parse(JSON.stringify(w));
  delete c._dirty;
  (c.agendas||[]).forEach(a=>(a.blocks||[]).forEach(b=>{
    if(b.type==="table" && Array.isArray(b.rows) && Array.isArray(b.rows[0]))
      b.rows = b.rows.map(r=>({c:r}));
  }));
  return c;
}
function fromFs(r){
  if(!r) return r;
  (r.agendas||[]).forEach(a=>(a.blocks||[]).forEach(b=>{
    if(b.type==="table" && Array.isArray(b.rows) && b.rows[0] && !Array.isArray(b.rows[0]) && b.rows[0].c)
      b.rows = b.rows.map(x=>x.c||[]);
  }));
  return r;
}
function fsReason(e){
  const m = String(e && (e.message||e.code) || "");
  if(/Nested arrays|invalid data/i.test(m)) return "저장할 수 없는 형식이 들어 있습니다";
  if(/permission-denied/i.test(m)) return "권한이 없습니다 (로그인·규칙 확인)";
  if(/unavailable|network|offline/i.test(m)) return "인터넷 연결을 확인해 주세요";
  if(/unauthenticated/i.test(m)) return "로그인이 풀렸습니다";
  return m.length>60 ? m.slice(0,60)+"…" : m;
}
async function fbPush(){
  if(!fbOn) return;
  const {doc, setDoc, deleteDoc, writeBatch, collection} = fbM;
  const dirty = state.weeks.filter(w=>w._dirty);
  const now = new Date().toISOString();
  const big = dirty.find(x=>JSON.stringify(x).length > 950000);
  if(big) throw new Error(`[${stripHtml(big.label)||big.date}] 주차의 그림 용량이 너무 큽니다. 그림을 줄여 주세요.`);
  const batch = writeBatch(db);
  dirty.forEach(w=>{
    const out = toFs(w); out._u = now; out._by = who();
    batch.set(doc(db, COL, w.id), out);
  });
  pendingDel.forEach(id=>batch.delete(doc(db, COL, id)));
  if(dirty.length || pendingDel.length) await batch.commit();
  dirty.forEach(w=>{ w._u = now; w._by = who(); delete w._dirty; conflicts.delete(w.id); });
  pendingDel = [];
  fbStamp = now;
  await store.set("mathlib-del", "[]");
}
async function fbUploadAll(){
  const {doc, writeBatch} = fbM;
  const now = new Date().toISOString();
  const batch = writeBatch(db);
  state.weeks.forEach(w=>{
    const out = toFs(w); out._u = now; out._by = who();
    batch.set(doc(db, COL, w.id), out);
  });
  await batch.commit();
  state.weeks.forEach(w=>{ w._u = now; w._by = who(); delete w._dirty; });
  fbStamp = now;
}

async function afterLogin(){
  try{
    const {collection, getDocs} = fbM;
    const snap = await getDocs(collection(db, COL));
    if(snap.empty){
      await fbUploadAll();
      toast(`저장소가 비어 있어 이 기기의 ${state.weeks.length}개 주차를 올렸습니다.`);
    }else{
      const remote = new Set(snap.docs.map(d=>d.id));
      const missing = state.weeks.filter(w=>!remote.has(w.id));
      if(missing.length){
        missing.forEach(w=>w._dirty = true);
        toast(`저장소에 없던 ${missing.length}개 주차를 올립니다.`);
        clearTimeout(pushTimer);
        try{ await fbPush(); svState("synced", `모든 기기에 저장됨 ${hhmm()}`); }
        catch(e){ svState("warn","전송 실패 — "+fsReason(e)); }
        refreshSaveBtn();
      }
    }
    renderSyncInfo(); await save(true);
  }catch(e){
    alert("저장소를 읽지 못했습니다.\n\n"+(e.code||e.message)+
      "\n\n보안 규칙을 게시했는지, 구글 로그인을 쓰신다면 규칙의 허용 계정 목록에 이 계정이 들어 있는지 확인해 주세요.");
  }
}
async function saveNow(){
  clearTimeout(pushTimer);
  if(state.view==="minutes") markDirty(cur());
  await save(true);
  if(!fbOn){ svState("local", `이 기기에 저장됨 ${hhmm()}`); return toast("저장했습니다."); }
  if(fbBusy) return;
  fbBusy=true; $("#btnSave").textContent="저장 중…"; svState("saving","다른 기기로 보내는 중…");
  try{
    await fbPush(); await store.set(KEY, JSON.stringify(payload()));
    svState("synced", `모든 기기에 저장됨 ${hhmm()}`);
    toast("저장하고 모든 기기에 반영했습니다.");
  }catch(e){
    svState("warn","전송 실패 — "+fsReason(e));
    toast("이 기기에는 안전하게 저장됐습니다. 전송 실패 : "+fsReason(e));
  }finally{ fbBusy=false; refreshSaveBtn(); renderSyncInfo(); }
}


/* ── 목록 ── */
function renderList(){
  const q = $("#q").value.trim().toLowerCase();
  const hit = w => !q || stripHtml(w.label+" "+w.date+" "+w.attendees+" "+JSON.stringify(w.agendas)).toLowerCase().includes(q);
  let rows = state.weeks.filter(hit);
  if(state.order === "desc") rows = rows.slice().reverse();
  $("#railCount").textContent = `${state.weeks.length}개 주차` + (q?` · ${rows.length}건 검색`:"") + ` · 버전 ${APP_VER}`;
  let html="", month="";
  if(!rows.length) html = `<div style="padding:22px 10px;color:#7fa29f;font-size:12.5px">검색 결과가 없습니다.</div>`;
  for(const w of rows){
    const m = w.date.slice(0,7);
    if(m!==month){ month=m; html += `<div class="mgroup">${m.replace("-","년 ")}월</div>`; }
    html += `<div class="witem" data-id="${w.id}" aria-current="${w.id===state.cur}">
      <input type="checkbox" data-pick="${w.id}" ${state.sel.has(w.id)?"checked":""} aria-label="${esc(w.label)} 인쇄 선택">
      <div class="wmain"><div class="wtitle">${esc(stripHtml(w.label))||"(제목 없음)"}</div>
        <div class="wsub">${fmtDate(w.date)}</div></div></div>`;
  }
  $("#list").innerHTML = html;
  $("#btnOrder").textContent = state.order === "desc" ? "최신순" : "과거순";
  scrollListToCurrent();
  $("#btnPrint").textContent = state.sel.size ? `선택 ${state.sel.size}건 인쇄` : "이 주차 인쇄";
  $("#btnShare").textContent = state.sel.size ? `선택 ${state.sel.size}건 이미지` : "이미지로 보내기";
}

function scrollListToCurrent(){
  const L = $("#list");
  const el = L.querySelector('.witem[aria-current="true"]');
  if(!el) return;
  const top = el.offsetTop - (L.clientHeight - el.offsetHeight)/2;
  L.scrollTop = Math.max(0, Math.min(top, L.scrollHeight - L.clientHeight));
}

/* ── 입력 연결 ── */
function hydrate(root, w){
  root.querySelectorAll("[data-edit]").forEach(el=>{
    const p = el.dataset.edit;
    if(!state.editing) return;
    el.addEventListener("blur", ()=>{ setPath(w,p,sanitize(el.innerHTML)); });
    el.addEventListener("focus",()=>{
      root.querySelectorAll("[data-edit].sel").forEach(x=>x.classList.remove("sel"));
      el.classList.add("sel"); state.focusPath = p; state.focusEl = el; updateFmtBar();
    });
    el.setAttribute("contenteditable","true");
    el.addEventListener("paste",ev=>{ ev.preventDefault();
      document.execCommand("insertText",false,(ev.clipboardData||window.clipboardData).getData("text")); });
    el.addEventListener("keydown",ev=>{ if(ev.key==="Enter"){ ev.preventDefault(); el.blur(); } });
    el.addEventListener("input",()=>{
      if(!el.textContent.trim() && !el.querySelector("span[style]")) el.innerHTML="";
      setPath(w,p,el.innerHTML); svState("typing","입력 중…"); save(); fitSoon();
    });
    el.addEventListener("blur",()=>{
      if(p==="date"||p.endsWith(".due")||p.endsWith(".status")) renderMain();
    });
  });
}

/* ── 글자 크기 · 색상 ── */
const DARK_COLORS = [["흰색 (기본)","#FFFFFF"],["노랑","#FFD84D"],["하늘","#8FD3FF"]];
function isDarkPath(p){ return p==="label" || /^agendas\.\d+\.no$/.test(p||""); }
function rgbKey(c){
  if(!c) return "";
  c = String(c).trim().toLowerCase();
  let m = /^#([0-9a-f]{6})$/.exec(c);
  if(m){ const n=parseInt(m[1],16); return [(n>>16)&255,(n>>8)&255,n&255].join(","); }
  m = /rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/.exec(c);
  return m ? [m[1],m[2],m[3]].join(",") : c;
}
const DARK_OK = new Set(DARK_COLORS.map(x=>rgbKey(x[1])));
/* 진한 칸에 어두운 색이 들어 있으면 떼어낸다 (예전에 칠한 주황 등) */
function keepLight(html){
  if(!html || !/color/i.test(html)) return html;
  const d = document.createElement("div"); d.innerHTML = html;
  d.querySelectorAll("[style]").forEach(el=>{
    if(el.style.color && !DARK_OK.has(rgbKey(el.style.color))) el.style.color = "";
  });
  return d.innerHTML;
}
const COLORS = [["검정 (기본)","#1A1A1A"],["파랑","#1257E8"],["빨강","#E0152A"],
                ["초록","#0E9048"],["주황","#EA6A00"]];
const INK = "#1A1A1A";
const BASE_MIN=6, BASE_MAX=18, FS_MIN=5, FS_MAX=36;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const num=v=>Math.round(v);

function fieldName(p){
  if(!p) return "";
  const F={label:"제목(주차명)",date:"일시",time:"회의시간",place:"장소",author:"작성자",
           attendees:"참석자",absent:"불참"};
  if(F[p]) return F[p];
  let m;
  if((m=p.match(/^prev\.(\d+)\.text$/))) return `전주 점검 ${+m[1]+1}줄`;
  if((m=p.match(/^prev\.(\d+)\.st$/))) return `전주 점검 ${+m[1]+1}줄 결과`;
  if((m=p.match(/^actions\.(\d+)\.(\w+)$/))){
    const c={task:"실행항목",owner:"담당자",due:"기한",status:"결과"};
    return `실행항목 ${+m[1]+1} · ${c[m[2]]||m[2]}`;
  }
  if((m=p.match(/^agendas\.(\d+)\.no$/))) return `안건 ${+m[1]+1} 번호`;
  if((m=p.match(/^agendas\.(\d+)\.title$/))) return `안건 ${+m[1]+1} 제목`;
  if((m=p.match(/^agendas\.(\d+)\.blocks\.(\d+)\.text$/))) return `안건 ${+m[1]+1} · ${+m[2]+1}줄`;
  if((m=p.match(/^agendas\.(\d+)\.blocks\.(\d+)\.no$/))) return `안건 ${+m[1]+1} · ${+m[2]+1}줄 번호`;
  if((m=p.match(/^agendas\.(\d+)\.blocks\.(\d+)\.cap$/))) return `안건 ${+m[1]+1} · 그림 설명`;
  if((m=p.match(/^agendas\.(\d+)\.blocks\.(\d+)\.rows/))) return `안건 ${+m[1]+1} · 표 칸`;
  return p;
}
function fieldEl(p){ return document.querySelector(`.scroll [data-edit="${p}"]`); }
function effSize(w,p){
  const f = w.fmt && w.fmt[p];
  if(f?.size) return f.size;
  const el = fieldEl(p);
  if(!el) return null;
  return num(parseFloat(getComputedStyle(el).fontSize) / (96/72));   /* px → pt */
}
function updateFmtBar(){
  const w = cur(); if(!w) return;
  $("#baseNum").value = num(w.base||10);
  const p = state.focusPath;
  const has = !!(p && fieldEl(p));
  const selText = state.focusEl && !(window.getSelection()?.isCollapsed ?? true)
    && state.focusEl.contains(window.getSelection().anchorNode);
  $("#selName").textContent = !has ? "— 칸을 눌러 선택"
    : (selText ? "선택한 글자에 적용" : fieldName(p));
  $("#selName").style.color = selText ? "var(--alert)" : "";
  ["fsMinus","fsPlus","fsNum","fmtReset"].forEach(id=>$("#"+id).disabled = !has);
  $("#fsNum").value = has ? (effSize(w,p) ?? "") : "";
  const dark = has && isDarkPath(p);
  if(swMode !== dark) renderSwatches(dark);
  const cc = has ? (w.fmt?.[p]?.color || (dark ? "#FFFFFF" : INK)) : null;
  $("#swatches").querySelectorAll(".sw").forEach(b=>
    b.setAttribute("aria-pressed", String(!!cc && b.dataset.color.toLowerCase()===cc.toLowerCase())));
}
function wrapSelection(style){
  const host = state.focusEl;
  const sel = window.getSelection();
  if(!host || !sel || !sel.rangeCount || sel.isCollapsed) return false;
  const r = sel.getRangeAt(0);
  if(!host.contains(r.commonAncestorContainer)) return false;
  const span = document.createElement("span");
  Object.assign(span.style, style);
  try{ r.surroundContents(span); }
  catch(e){ span.appendChild(r.extractContents()); r.insertNode(span); }
  sel.removeAllRanges();
  return span;
}
function applyFmt(patch){
  const w = cur(), p = state.focusPath;
  if(!w || !p || !fieldEl(p)) return toast("먼저 바꿀 칸을 눌러 선택하세요.");
  /* 글자를 드래그해 선택한 상태라면 그 부분에만 적용 */
  if(state.focusEl && !window.getSelection().isCollapsed){
    const st = {};
    if(patch.color) st.color = patch.color;
    if(patch.size) st.fontSize = patch.size+"pt";
    const reset = patch.color === null;
    if(reset || Object.keys(st).length){
      const span = wrapSelection(st);
      if(span){
        if(reset){ span.style.color = "";
                   span.querySelectorAll("*").forEach(x=>{ if(x.style) x.style.color=""; }); }
        setPath(w, p, sanitize(state.focusEl.innerHTML));
        save(); fitSoon();
        return toast(reset ? "선택한 부분의 색을 지웠습니다." : "선택한 부분에만 적용했습니다.");
      }
    }
  }
  w.fmt ||= {};
  const f = Object.assign(w.fmt[p] || {}, patch);
  if(!f.size) delete f.size;
  if(!f.color || f.color.toLowerCase()===INK.toLowerCase()) delete f.color;
  if(Object.keys(f).length) w.fmt[p]=f; else delete w.fmt[p];
  const el = fieldEl(p);
  el.style.fontSize = f.size ? f.size+"pt" : "";
  el.style.color = f.color || "";
  save(); fitSoon(); updateFmtBar();
}
function setBase(v){
  const w = cur(); if(!w) return;
  w.base = clamp(num(v), BASE_MIN, BASE_MAX);
  const page = document.querySelector(".scroll .page");
  if(page) page.style.fontSize = w.base+"pt";
  save(); fitSoon(); updateFmtBar();
}
let swMode = null;
function renderSwatches(dark){
  const list = dark ? DARK_COLORS : COLORS;
  $("#swatches").innerHTML = list.map(([n,c])=>
    `<button class="sw" data-color="${c}" style="background:${c}${c==="#FFFFFF"?";box-shadow:0 0 0 1px #9aa6a4":""}" title="${n}" aria-label="${n}" aria-pressed="false"></button>`).join("");
  swMode = dark;
}
renderSwatches(false);
$("#fmtbar").addEventListener("mousedown",e=>{ if(e.target.closest("button")) e.preventDefault(); });
$("#fmtbar").addEventListener("click",e=>{
  const t = e.target.closest("button"); if(!t) return;
  const w = cur(); if(!w) return;
  if(t.dataset.base!==undefined) return setBase((w.base||10)+parseFloat(t.dataset.base));

/* ── A4 한 장에 맞추기 (엑셀의 ‘한 페이지에 맞추기’와 같은 동작) ── */
function fitSheet(sheet){
  const page = sheet.querySelector(".page");
  if(!page) return 1;
  const avail = PAGE_H - PAD_V*2;
  const set = k => { page.style.transform = k<1 ? `scale(${k})` : "none";
                     page.style.width = k<1 ? (100/k)+"%" : "100%"; };
  set(1);
  let k = 1;
  const h0 = page.scrollHeight;
  if(h0 > avail){
    k = avail/h0;                       /* 폭이 넓어지며 줄바꿈이 줄어드니 반드시 들어감 */
    for(let i=0;i<5;i++){
      set(k);
      const h = page.scrollHeight*k;
      if(h > avail){ k *= avail/h*0.995; continue; }
      if(avail-h < avail*0.015) break;  /* 충분히 꽉 찼으면 끝 */
      const up = Math.min(1, k*(avail/h)*0.995);
      if(up-k < 0.004) break;
      k = up;
    }
    set(k);
    let guard=0;
    while(page.scrollHeight*k > avail && guard++<60){ k*=0.985; set(k); }
  }
  set(k);
  return k;
}
function fitStage(){
  document.querySelectorAll(".scroll .stage").forEach(st=>{
    const sheet = st.querySelector(".sheet");
    if(!sheet) return;
    const room = $("#scroll").clientWidth - 40;
    const z = Math.max(.3, Math.min(1, room/PAGE_W));
    sheet.style.transform = `scale(${z})`;
    st.style.width = (PAGE_W*z)+"px";
    st.style.height = (PAGE_H*z)+"px";
    st.dataset.zoom = z;
  });
}
let fitTimer;
function fitSoon(){ clearTimeout(fitTimer); fitTimer=setTimeout(fitAll,180); }
function fitAll(){
  document.querySelectorAll(".scroll .sheet, #printArea .sheet").forEach(sh=>{
    const z = sh.style.transform;             /* 화면 배율 잠시 해제하고 본문 배율 계산 */
    sh.style.transform = "none";
    const k = fitSheet(sh);
    sh.style.transform = z;
    if(sh.closest(".scroll")) $("#fitInfo").textContent = k<0.995 ? `본문 배율 ${Math.round(k*100)}%` : "";
  });
  fitStage();
}

function newWeek(){
  const base = state.weeks[state.weeks.length-1];
  const d = base ? new Date(base.date+"T00:00:00") : new Date();
  if(base) d.setDate(d.getDate()+7);
  const iso = d.toISOString().slice(0,10);
  const nd = new Date(d); nd.setDate(nd.getDate()+7);
  const carry = (base?.actions || [])
    .filter(a=>stripHtml(a.task).trim())
    .map(a=>({
      text: stripHtml(a.task)
        + (a.owner ? ` (${stripHtml(a.owner)}${a.due?`, ~${stripHtml(a.due)}`:""})`
                   : (a.due ? ` (~${stripHtml(a.due)})` : "")),
      st: stripHtml(a.status||"")
    }));
  const titles = base?.agendas?.length
    ? base.agendas.map(a=>a.no)
    : ["안건1","안건2","안건3"];
  const w = {
    id: uid(), date: iso,
    ampm: base?.ampm || "PM", hh: base?.hh ?? 2, mm: base?.mm ?? 30,
    label: `${d.getMonth()+1}월 ${Math.ceil(d.getDate()/7)}주차`,
    author: base?.author || "", attendees: base?.attendees || "",
    absent: "", place: base?.place || "",
    prev: carry.length ? carry.concat(
            Array.from({length:Math.max(0,3-carry.length)},()=>({text:"",st:""})))
          : [0,1,2].map(()=>({text:"",st:""})),
    actions: [0,1,2].map(()=>({task:"",owner:"",due:"",status:""})),
    agendas: titles.map(no=>({ no, title:"",
      blocks:[0,1,2].map((_,j)=>({type:"text",no:`${j+1})`,text:""})) })),
    next: {date: nd.toISOString().slice(0,10),
           ampm: base?.ampm || "PM", hh: base?.hh ?? 2, mm: base?.mm ?? 30}
  };
  w._dirty = true;
  state.weeks.push(w);
  state.weeks.sort((a,b)=>a.date.localeCompare(b.date));
  state.cur = w.id; state.view="minutes"; state.editing=true;
  setTab(); renderList(); renderMain(); save(true);
  toast("새 주차를 만들었습니다. 일시·장소부터 확인하세요.");
}
function duplicate(){
  const w = cur(); if(!w) return;
  const c = JSON.parse(JSON.stringify(w));
  c.id = uid(); c.label = w.label + " (사본)"; delete c._u; c._dirty = true;
  state.weeks.push(c); state.weeks.sort((a,b)=>a.date.localeCompare(b.date));
  state.cur=c.id; renderList(); renderMain(); save(true); toast("복제했습니다.");
}
function removeWeek(){
  const w = cur(); if(!w) return;
  if(!confirm(`[${stripHtml(w.label)||w.date}] 회의록을 삭제합니다. 되돌릴 수 없습니다.`)) return;

  state.cur = (state.weeks[i]||state.weeks[i-1])?.id ?? null;

}

/* ══════════ 회의록을 이미지로 만들어 공유 ══════════ */
const H2C = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
let h2cPromise = null, shareFiles = [], shareUrl = null;
function loadH2C(){
  if(window.html2canvas) return Promise.resolve(window.html2canvas);
  return h2cPromise ||= new Promise((res,rej)=>{
    const t = document.createElement("script");
    t.src = H2C; t.crossOrigin = "anonymous";
    t.onload = ()=> window.html2canvas ? res(window.html2canvas) : rej(new Error("load"));
    t.onerror = ()=>{ h2cPromise = null; rej(new Error("net")); };
    document.head.appendChild(t);
  });
}
function shotName(w){
  const t = stripHtml(w.label).replace(/[\\/:*?"<>|]/g,"").trim() || w.date;
  return `중등부회의록_${t}.png`;
}
async function makeShot(w, h2c){
  const host = $("#capHost");
  host.innerHTML = sheetHTML(w, false);
  const sheet = host.querySelector(".sheet");
  sheet.style.boxShadow = "none";
  fitSheet(sheet);
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  const canvas = await h2c(sheet, {
    backgroundColor:"#ffffff", scale:2, useCORS:true, logging:false,
    width: sheet.offsetWidth, height: sheet.offsetHeight,
    windowWidth: sheet.offsetWidth, windowHeight: sheet.offsetHeight
  });
  host.innerHTML = "";
  const blob = await new Promise(r=>canvas.toBlob(r, "image/png"));
  return new File([blob], shotName(w), {type:"image/png"});
}
async function doShare(){
  const ids = state.sel.size ? [...state.sel] : (state.cur ? [state.cur] : []);
  if(!ids.length) return toast("보낼 주차가 없습니다.");
  const ws = state.weeks.filter(w=>ids.includes(w.id));

  shareFiles = []; if(shareUrl){ URL.revokeObjectURL(shareUrl); shareUrl = null; }
  $("#shareTitle").textContent = ws.length>1 ? `이미지로 보내기 (${ws.length}장)` : "이미지로 보내기";
  $("#shareMsg").textContent = "이미지를 만들고 있습니다…";
  $("#shareShot").innerHTML = `<div class="ph">잠시만 기다려 주세요</div>`;
  ["shareCopy","shareDown","shareGo"].forEach(id=>$("#"+id).hidden = true);
  $("#shareModal").hidden = false;

  let h2c;
  try{ h2c = await loadH2C(); }
  catch(e){
    $("#shareMsg").textContent =
      "이미지 변환 기능을 불러오지 못했습니다. 인터넷에 연결된 상태에서 한 번만 실행하면 그 뒤로는 오프라인에서도 됩니다.";
    $("#shareShot").innerHTML = `<div class="ph">불러오기 실패</div>`;
    return;
  }
  try{
    for(const w of ws) shareFiles.push(await makeShot(w, h2c));
  }catch(e){
    $("#shareMsg").textContent = "이미지를 만들지 못했습니다. ("+(e.message||e)+")";
    return;
  }
  shareUrl = URL.createObjectURL(shareFiles[0]);
  $("#shareShot").innerHTML = `<img src="${shareUrl}" alt="회의록 미리보기">`;

  const canShare = !!(navigator.canShare && navigator.canShare({files:shareFiles}));
  $("#shareGo").hidden = !canShare;
  $("#shareDown").hidden = false;
  $("#shareCopy").hidden = !(navigator.clipboard && window.ClipboardItem) || ws.length>1;
  $("#shareMsg").textContent = canShare
    ? "[공유하기]를 누르면 카카오톡·메시지 목록이 뜹니다."
    : "PC에서는 [복사] 후 카톡 대화창에 붙여넣거나, [저장] 후 파일로 첨부하세요.";
}

/* 그림 삽입 : 용량을 줄여 저장 */
function pickImage(ai){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*";
  inp.onchange = async ()=>{
    const f = inp.files && inp.files[0]; if(!f) return;
    try{
      const src = await shrinkImage(f, 900, 0.72);
      const w = cur(); if(!w) return;
      w.agendas[ai].blocks.push({type:"img", src, w:70, cap:""});
      renderMain(); save();
      const kb = Math.round(src.length*0.75/1024);
      toast(`그림을 넣었습니다. (약 ${kb}KB)`);
      if(JSON.stringify(w).length > 700000)
        alert("이 주차에 그림이 많아 용량이 큽니다.\n연동 저장이 실패할 수 있으니 그림을 줄이거나 나눠 주세요.");
    }catch(e){ toast("그림을 넣지 못했습니다."); }
  };
  inp.click();
}
function shrinkImage(file, maxW, q){
  return new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onload = ()=>{
      const im = new Image();
      im.onload = ()=>{
        const sc = Math.min(1, maxW/im.width);
        const c = document.createElement("canvas");
        c.width = Math.round(im.width*sc); c.height = Math.round(im.height*sc);
        const g = c.getContext("2d");
        g.fillStyle = "#fff"; g.fillRect(0,0,c.width,c.height);
        g.drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL("image/jpeg", q));
      };
      im.onerror = rej; im.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

  const w = cur(), t = e.target;

  if(t.id==="addPrev"&&w){ w.prev.push({text:"",st:""}); renderMain(); save(); return; }
  if(t.dataset.delprev!==undefined&&w){
    if(w.prev.length<=1) return;
    w.prev.splice(+t.dataset.delprev,1); renderMain(); save(); return; }
  if(t.id==="addAg"&&w){ w.agendas.push({no:"안건"+(w.agendas.length+1),title:"",
    blocks:[{type:"text",no:"1)",text:""}]}); renderMain(); save(); return; }
  if(t.dataset.delact!==undefined&&w){ w.actions.splice(+t.dataset.delact,1); renderMain(); save(); return; }
  if(t.dataset.addline!==undefined&&w){ const ag=w.agendas[+t.dataset.addline];
    const nums = ag.blocks.filter(b=>b.type!=="text"?false:/^\s*\(?\d/.test(b.no||"")).length;
    ag.blocks.push({type:"text",no:`${nums+1})`,text:""}); renderMain(); save(); return; }
  if(t.dataset.addtable!==undefined&&w){
    const ag=w.agendas[+t.dataset.addtable];
    ag.blocks.push({type:"table", rows:[0,1,2].map(()=>[0,1,2].map(()=>({span:1,v:""})))});
    renderMain(); save(); return; }
  if(t.dataset.addimg!==undefined&&w){ pickImage(+t.dataset.addimg); return; }
  if(t.dataset.tb&&w){
    const [op,ai,bi] = t.dataset.tb.split("|");
    const b = w.agendas[+ai].blocks[+bi]; const R=b.rows;
    const cols = R[0] ? R[0].length : 3;
    if(op==="row+") R.push(Array.from({length:cols},()=>({span:1,v:""})));
    if(op==="row-" && R.length>1) R.pop();
    if(op==="col+") R.forEach(r=>r.push({span:1,v:""}));
    if(op==="col-" && cols>1) R.forEach(r=>r.pop());
    renderMain(); save(); return; }
  if(t.dataset.tal&&w){
    const [al,ai,bi] = t.dataset.tal.split("|");
    w.agendas[+ai].blocks[+bi].align = al; markDirty(w); renderMain(); save(); return; }
  if(t.dataset.im&&w){
    const [pc,ai,bi] = t.dataset.im.split("|");
    w.agendas[+ai].blocks[+bi].w = +pc; renderMain(); save(); return; }
  if(t.dataset.delag!==undefined&&w){ if(confirm("이 안건을 삭제할까요?")){ w.agendas.splice(+t.dataset.delag,1); renderMain(); save(); } return; }
  if(t.dataset.delblock!==undefined&&w){ const [a,b]=t.dataset.delblock.split(".").map(Number);
    w.agendas[a].blocks.splice(b,1); renderMain(); save(); return; }
  if(t.dataset.cfkeep&&w){ conflicts.delete(w.id); renderMain(); return; }
  if(t.dataset.cftake&&w){
    const r = conflicts.get(w.id); conflicts.delete(w.id);
    const i = state.weeks.indexOf(w);
    state.weeks[i] = r; normalize(); renderList(); renderMain(); save(true);
    toast("상대 내용을 가져왔습니다."); return;
  }
  if(t.dataset.f){ state.filter=t.dataset.f; renderTracker(); return; }
  if(t.dataset.go){ state.cur=t.dataset.go; state.view="minutes"; setTab(); renderList(); renderMain(); return; }
});

function parseCfg(txt){
  let t = txt.trim().replace(/^const\s+\w+\s*=\s*/,"").replace(/;$/,"").trim();
  if(!t.startsWith("{")) t = "{"+t+"}";
  t = t.replace(/,\s*\}/g,"}").replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g,'$1"$2":').replace(/'/g,'"');
  const o = JSON.parse(t);
  if(!o.apiKey || !o.projectId) throw new Error("apiKey 또는 projectId 가 없습니다");
  return o;
}

/* ── 시작 ── */
function normalize(){
  const pt = s=>{ const m=/(AM|PM)\s*(\d{1,2}):(\d{2})/.exec(s||""); 
                  return m? {ampm:m[1],hh:+m[2],mm:+m[3]} : {ampm:"PM",hh:2,mm:30}; };
  state.weeks.forEach(w=>{
    w.actions ||= []; w.agendas ||= [];
    w.prev = (Array.isArray(w.prev) ? w.prev : []).map(x=>
      (x && typeof x === "object") ? {text:x.text||"", st:x.st||""} : {text:x||"", st:""});
    while(w.prev.length < 3) w.prev.push({text:"",st:""});
    w.actions.forEach(a=>{ delete a.note;
      if(a.status==="미착수"||a.status==="보류"||a.status==="취소") a.status=""; });
    while(w.actions.length < 3) w.actions.push({task:"",owner:"",due:"",status:""});
    delete w.fresh; delete w.ph;
    if(!w.id) w.id = uid();
    w.agendas.forEach(a=>{
      delete a.phTitle;
      (a.blocks||[]).forEach(b=>{
        delete b.ph;
        if(b.type==="table" || b.type==="img") return;
        b.type = "text";
        if(b.no === undefined){
          const t = String(b.text||"");
          const m = /^(\s*)(\(?\d{1,2}[).]|[\u2460-\u2473]|[가-하]\)|[A-Za-z]\))\s*/.exec(t);
          if(m){ b.no = m[2]; b.text = t.slice(m[0].length); }
          else { b.no = ""; }
        }
      });
    });
    if(w.ampm===undefined){ Object.assign(w, pt(w.time)); }
    delete w.time;
    if(!PLACES.includes(w.place)) w.place = "";
    const n = w.next || {};
    if(!n.date || n.when!==undefined){
      let dd=null;
      const m = /(\d{1,2})\s*\/\s*(\d{1,2})/.exec(n.when||"");
      const base = new Date(w.date+"T00:00:00");
      if(m){ const yr = base.getFullYear() + ((+m[1]) < base.getMonth()-5 ? 1 : 0);
             const c = new Date(yr, +m[1]-1, +m[2]);
             if(!isNaN(c)) dd = c.toISOString().slice(0,10); }
      if(!dd){ const c=new Date(base); c.setDate(c.getDate()+7); dd=c.toISOString().slice(0,10); }
      const t = n.when ? pt(n.when) : {ampm:w.ampm,hh:w.hh,mm:w.mm};
      w.next = {date:dd, ...t};
    }
    w.next.ampm ||= w.ampm; w.next.hh ??= w.hh; w.next.mm ??= w.mm;
  });
  state.weeks.sort((a,b)=>a.date.localeCompare(b.date));
}
(async function(){
  try{ if(navigator.storage?.persist) await navigator.storage.persist(); }catch(e){}   /* 브라우저 자동 정리 방지 */

  const saved = await store.get(KEY);
  let data = null;
  if(saved){ try{ data = unwrap(JSON.parse(saved)); }catch(e){} }
  if(data) lastLocalStamp = data.updatedAt;

  try{
    const raw = await store.get(FBKEY);
    if(raw === "off") fbCfg = null;
    else fbCfg = (raw && JSON.parse(raw)) || DEFAULT_FB;
  }catch(e){ fbCfg = DEFAULT_FB; }
  try{ pendingDel = JSON.parse(await store.get("mathlib-del")||"[]"); }catch(e){}
  autoSync = (await store.get(AUTOKEY)) !== "0";
  bkDate = await store.get(BKKEY);
  autoBk = (await store.get(BKONKEY)) !== "0";

  /* 연결해 둔 저장 파일이 있으면 그쪽을 우선 */
  try{ fileHandle = await idbGet("fileHandle"); }catch(e){}
  if(fileHandle && await perm(fileHandle,false)){
    try{
      const d = await fileRead();
      if(d && d.weeks.length){
        if(!data || !d.updatedAt || !data.updatedAt || d.updatedAt >= data.updatedAt) data = d;
      }
      fileLinked = true;
    }catch(e){ fileErr="읽기 실패"; }
  }
  renderFileInfo();

  state.weeks = (data && data.weeks.length) ? data.weeks : JSON.parse(JSON.stringify(SEED));
  normalize();
  let ui = null;
  try{ ui = JSON.parse(await store.get(UIKEY)); }catch(e){}
  /* 열 때는 항상 날짜가 가장 늦은(마지막) 주차부터 */
  state.cur = state.weeks[state.weeks.length-1]?.id ?? null;
  if(ui){ state.view = ui.view==="tracker" ? "tracker" : "minutes";
          state.filter = ui.filter || state.filter;
          state.order = ui.order === "desc" ? "desc" : "asc"; }
  state.editing = false;
  setTab(); renderList(); renderMain();
  refreshSaveBtn(); svIdle(); renderFootStat();
  if(document.fonts?.ready) document.fonts.ready.then(fitAll);
  if(fileLinked) fileWrite();
  renderSyncInfo();
  if(fbCfg) fbConnect(fbCfg).then(u=>{ if(u) afterLogin(); }).catch(e=>{
    fbOn=false; renderSyncInfo(); toast("연동 서버에 연결하지 못했습니다. 이 기기에는 정상 저장됩니다."); });
})();
